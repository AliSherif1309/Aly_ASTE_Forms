    <title>Work Hub</title>

        body {
            margin: 0;

            background-color: #121212;

            color: white;
            text-align: center;
        }
        h2 { margin-bottom: 30px; color: #aaa; }
        
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .launcher-btn {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            padding: 20px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-decoration: none;
            transition: 0.2s;
        }

        .launcher-btn:active { background-color: #333; }
        .launcher-btn span { font-size: 24px; }
    </style>
</head>
