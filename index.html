<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- PWA Meta Tags to make it act like a native app -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1e1e">
    
    <title>Work Hub</title>
    
    <style>
        /* Base styling to lock the screen size */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        .nav-bar {
            display: flex;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        /* Individual Tab Buttons */
        .nav-btn {
            flex: 1;
            text-align: center;
            background: none;
            border: none;
            color: #888;
            font-size: 11px;
            padding: 10px 2px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-btn span {
            display: block;
            font-size: 20px; /* Emoji size */
            margin-bottom: 4px;
        }

        /* Active Tab Styling */
        .nav-btn.active {
            color: #4daafc;
            border-bottom: 3px solid #4daafc;
            background-color: #252525;
        }

        /* The iframe wrapper */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Menu -->
    <div class="nav-bar">
        <button class="nav-btn active" id="btn-service" onclick="switchForm('service')">
            <span>🛠️</span>Service
        </button>
        <button class="nav-btn" id="btn-weekly" onclick="switchForm('weekly')">
            <span>📅</span>Weekly
        </button>
        <button class="nav-btn" id="btn-spares" onclick="switchForm('spares')">
            <span>⚙️</span>Spares
        </button>
        <button class="nav-btn" id="btn-find" onclick="switchForm('find')">
            <span>🔍</span>Find
        </button>
        <button class="nav-btn" id="btn-speed" onclick="switchForm('speed')">
            <span>⚡</span>Speed
        </button>
    </div>

    <!-- Where the MS Forms will load -->
    <div class="iframe-container">
        <iframe id="form-frame" src="https://forms.office.com/Pages/ResponsePage.aspx?id=502OJv3HH0K2h6P126U76P3l_KjInY1Cis4sjYjijx9URDFEU0dMNDZDWDc0T0Y2Tk9VSUFUVUNNOS4u&embed=true" allowfullscreen></iframe>
    </div>

    <script>
        // Dictionary containing all your MS Form URLs
        const forms = {
            'service': 'https://forms.office.com/Pages/ResponsePage.aspx?id=502OJv3HH0K2h6P126U76P3l_KjInY1Cis4sjYjijx9URDFEU0dMNDZDWDc0T0Y2Tk9VSUFUVUNNOS4u&embed=true',
            'weekly': 'https://forms.office.com/Pages/ResponsePage.aspx?id=502OJv3HH0K2h6P126U76P3l_KjInY1Cis4sjYjijx9UNjhEVzNGTVJLTUNBTE5YWTdQVVZUVUoxQS4u&embed=true',
            'spares': 'https://forms.office.com/Pages/ResponsePage.aspx?id=502OJv3HH0K2h6P126U76P3l_KjInY1Cis4sjYjijx9UMkdWNzlFSzkyWFM5WjVKWFEyUDdIVUpITy4u&embed=true',
            'find': 'https://forms.office.com/Pages/ResponsePage.aspx?id=502OJv3HH0K2h6P126U76P3l_KjInY1Cis4sjYjijx9UN0pYOVBSVTc5UTY4UUs5SUFMWlowTVgxRS4u&embed=true',
            'speed': 'https://forms.office.com/Pages/ResponsePage.aspx?id=502OJv3HH0K2h6P126U76P3l_KjInY1Cis4sjYjijx9UNENSRFVER0pXU0tIMDczQ09CWlNGTDJWUS4u&embed=true'
        };

        function switchForm(formId) {
            // 1. Change the URL of the iframe
            document.getElementById('form-frame').src = forms[formId];

            // 2. Remove 'active' class from all buttons
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 3. Add 'active' class to the button that was just clicked
            document.getElementById('btn-' + formId).classList.add('active');
        }
    </script>

</body>
</html>
